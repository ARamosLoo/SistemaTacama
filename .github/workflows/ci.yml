name: CI — TacamaMesa

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.15.4'

jobs:
  # ─── Lint y formato ────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar lint
        run: pnpm run lint

  # ─── Tests unitarios ───────────────────────────────────────
  test:
    name: Tests Unitarios
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Los clientes de Prisma no se suben al repositorio (carpeta generated/): se generan aquí
      - name: Generar clientes de Prisma
        run: pnpm --filter "./services/*" exec prisma generate

      - name: Build paquetes compartidos
        run: pnpm run build --filter="./packages/*"

      - name: Ejecutar tests
        run: pnpm run test
        env:
          NODE_ENV: test


  # ─── Build de servicios ────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Los clientes de Prisma no se suben al repositorio (carpeta generated/): se generan aquí
      - name: Generar clientes de Prisma
        run: pnpm --filter "./services/*" exec prisma generate

      - name: Build completo (Turborepo)
        run: pnpm run build
