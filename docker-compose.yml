# =============================================================
# docker-compose.yml — TacamaMesa
# Infraestructura local: PostgreSQL · Redis · RabbitMQ · Traefik
# Uso: docker-compose up -d
# =============================================================


# ── Red interna compartida ───────────────────────────────────
networks:
  tacama-net:
    driver: bridge

# ── Volúmenes persistentes ───────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  traefik_certs:

services:

  # ============================================================
  # TRAEFIK — API Gateway / Reverse Proxy
  # Puerto 80  → HTTP (redirige a HTTPS en prod)
  # Puerto 443 → HTTPS
  # Puerto 8080 → Dashboard Traefik (solo dev)
  # ============================================================
  traefik:
    image: traefik:v3.1
    container_name: tacama-traefik
    restart: unless-stopped
    command:
      # Habilitar dashboard (solo dev)
      - "--api.insecure=true"
      - "--api.dashboard=true"
      # Provider Docker
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=tacama-net"
      # Provider de archivo: rutas hacia servicios locales (host.docker.internal)
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Log level
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "${GATEWAY_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      # Socket Docker para detección automática de contenedores
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_certs:/certs"
      - "./infra/traefik:/etc/traefik/dynamic:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tacama-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"

  # ============================================================
  # POSTGRESQL — Base de datos relacional
  # Un schema por microservicio, sin tablas compartidas
  # Puerto: 5432 (expuesto solo en dev)
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: tacama-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tacama_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tacama_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-tacamamesa}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script de inicialización: crea los schemas de cada servicio
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - tacama-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tacama_user} -d ${POSTGRES_DB:-tacamamesa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # REDIS — Caché de carta, traducciones y reglas de maridaje
  # Puerto: 6379
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: tacama-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret_2024}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - tacama-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # RABBITMQ — Mensajería asíncrona entre microservicios
  # Puerto 5672 → AMQP
  # Puerto 15672 → Management UI (solo dev)
  # Exchanges: ComandaConfirmada, ComandaAnulada, StockBajo
  # ============================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: tacama-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tacama_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mq_secret_2024}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-tacamamesa}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - tacama-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================================
  # SANDBOX BODEGA — Simulador del inventario de la bodega
  # Nunca conectar al sistema real de producción (RN)
  # Puerto: 9999
  # ============================================================
  bodega-sandbox:
    image: wiremock/wiremock:3.5.4-alpine
    container_name: tacama-bodega-sandbox
    restart: unless-stopped
    command:
      - "--global-response-templating"
      - "--verbose"
    ports:
      - "9999:8080"
    volumes:
      - ./infra/sandbox/mappings:/home/wiremock/mappings:ro
      - ./infra/sandbox/__files:/home/wiremock/__files:ro
    networks:
      - tacama-net
    labels:
      - "traefik.enable=false"

  # ============================================================
  # AUTH-SERVICE — Puerto 3001
  # ============================================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
      target: development
    container_name: tacama-auth
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_MESA_SECRET: ${JWT_MESA_SECRET}
      JWT_MESA_EXPIRES_IN: ${JWT_MESA_EXPIRES_IN}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tacama-net
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/mesas`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=3001"
      # Rate limiting: 100 req/min por IP
      - "traefik.http.middlewares.auth-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.auth-ratelimit.ratelimit.period=1m"
      - "traefik.http.routers.auth.middlewares=auth-ratelimit"

  # ============================================================
  # CATALOGO-I18N-SERVICE — Puerto 3002
  # ============================================================
  catalogo-i18n-service:
    build:
      context: ./services/catalogo-i18n-service
      dockerfile: Dockerfile
      target: development
    container_name: tacama-catalogo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${CATALOGO_DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tacama-net
    volumes:
      - ./services/catalogo-i18n-service:/app
      - /app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catalogo.rule=PathPrefix(`/api/v1/carta`) || PathPrefix(`/api/v1/platos`)"
      - "traefik.http.routers.catalogo.entrypoints=web"
      - "traefik.http.services.catalogo.loadbalancer.server.port=3002"

  # ============================================================
  # MARIDAJE-SERVICE — Puerto 3003
  # ============================================================
  maridaje-service:
    build:
      context: ./services/maridaje-service
      dockerfile: Dockerfile
      target: development
    container_name: tacama-maridaje
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${MARIDAJE_DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PORT: 3003
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tacama-net
    volumes:
      - ./services/maridaje-service:/app
      - /app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maridaje.rule=PathPrefix(`/api/v1/maridajes`) || PathPrefix(`/api/v1/reglas-maridaje`)"
      - "traefik.http.routers.maridaje.entrypoints=web"
      - "traefik.http.services.maridaje.loadbalancer.server.port=3003"

  # ============================================================
  # COMANDAS-SERVICE — Puerto 3004
  # WebSocket (Socket.IO) también en 3004
  # ============================================================
  comandas-service:
    build:
      context: ./services/comandas-service
      dockerfile: Dockerfile
      target: development
    container_name: tacama-comandas
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${COMANDAS_DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_MESA_SECRET: ${JWT_MESA_SECRET}
      PORT: 3004
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tacama-net
    volumes:
      - ./services/comandas-service:/app
      - /app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.comandas.rule=PathPrefix(`/api/v1/comandas`) || PathPrefix(`/api/v1/valoraciones`)"
      - "traefik.http.routers.comandas.entrypoints=web"
      - "traefik.http.services.comandas.loadbalancer.server.port=3004"
      # WebSocket support
      - "traefik.http.middlewares.sio-headers.headers.customrequestheaders.X-Forwarded-Proto=http"

  # ============================================================
  # INVENTARIO-SERVICE — Puerto 3005
  # ============================================================
  inventario-service:
    build:
      context: ./services/inventario-service
      dockerfile: Dockerfile
      target: development
    container_name: tacama-inventario
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${INVENTARIO_DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      BODEGA_SANDBOX_URL: ${BODEGA_SANDBOX_URL:-http://bodega-sandbox:8080/sandbox}
      BODEGA_SANDBOX_API_KEY: ${BODEGA_SANDBOX_API_KEY}
      PORT: 3005
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      bodega-sandbox:
        condition: service_started
    networks:
      - tacama-net
    volumes:
      - ./services/inventario-service:/app
      - /app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.inventario.rule=PathPrefix(`/api/v1/existencias`)"
      - "traefik.http.routers.inventario.entrypoints=web"
      - "traefik.http.services.inventario.loadbalancer.server.port=3005"

  # ============================================================
  # ANALITICA-AUDITORIA-SERVICE — Puerto 3006
  # ============================================================
  analitica-auditoria-service:
    build:
      context: ./services/analitica-auditoria-service
      dockerfile: Dockerfile
      target: development
    container_name: tacama-analitica
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${ANALITICA_DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      PORT: 3006
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tacama-net
    volumes:
      - ./services/analitica-auditoria-service:/app
      - /app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.analitica.rule=PathPrefix(`/api/v1/indicadores`) || PathPrefix(`/api/v1/auditoria`)"
      - "traefik.http.routers.analitica.entrypoints=web"
      - "traefik.http.services.analitica.loadbalancer.server.port=3006"
